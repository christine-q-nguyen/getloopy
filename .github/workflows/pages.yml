# Deploys the static site to GitHub Pages on every push to main.
# It only runs once Pages is enabled for the repository with the "GitHub Actions" source:
#   gh api -X POST repos/christine-q-nguyen/getloopy/pages -f build_type=workflow
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: rsync -a --exclude '.git*' --exclude '.github' --exclude 'tools' --exclude 'README.md' --exclude '_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
